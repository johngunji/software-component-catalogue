<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Browse Components | ComponentHub</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>
        .browse-page {
            padding: 45px 5% 70px;
            background: #f8f9fd;
            min-height: calc(100vh - 76px);
        }

        .browse-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 30px;
        }

        .browse-header h1 {
            font-size: 34px;
            margin-bottom: 8px;
        }

        .browse-header p {
            color: var(--muted);
            font-size: 14px;
        }

        .component-count-total {
            color: var(--primary);
            font-weight: 600;
        }

        /* Filters */

        .filters {
            background: white;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 30px;
        }

        .filter-search {
            position: relative;
        }

        .filter-search input,
        .filter-select {
            width: 100%;
            height: 44px;
            border: 1px solid #dce1eb;
            border-radius: 9px;
            padding: 0 13px;
            outline: none;
            background: white;
            color: var(--text);
        }

        .filter-search input:focus,
        .filter-select:focus {
            border-color: var(--primary);
        }

        /* Components */

        .components-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .component-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 22px;
            transition: 0.2s;
            cursor: pointer;
        }

        .component-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(35, 55, 100, 0.08);
            border-color: #cbd2ed;
        }

        .component-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 17px;
        }

        .component-icon {
            width: 45px;
            height: 45px;
            border-radius: 11px;
            background: #eef0ff;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
        }

        .component-type {
            font-size: 11px;
            padding: 5px 9px;
            border-radius: 20px;
            background: #edf8f4;
            color: #15936a;
        }

        .component-card h3 {
            font-size: 17px;
            margin-bottom: 8px;
        }

        .component-description {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.55;
            min-height: 40px;
            margin-bottom: 15px;
        }

        .component-meta {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
            margin-bottom: 17px;
        }

        .tag {
            background: #f0f3fa;
            color: #52617d;
            padding: 5px 9px;
            border-radius: 6px;
            font-size: 11px;
        }

        .component-footer {
            border-top: 1px solid #edf0f5;
            padding-top: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .usage {
            color: #66758f;
            font-size: 12px;
        }

        .view-button {
            border: none;
            background: transparent;
            color: var(--primary);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .no-results {
            display: none;
            background: white;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 60px;
            text-align: center;
            color: var(--muted);
        }

        @media (max-width: 1000px) {
            .filters {
                grid-template-columns: 1fr 1fr;
            }

            .components-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 650px) {
            .browse-page {
                padding: 30px 5%;
            }

            .browse-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .filters {
                grid-template-columns: 1fr;
            }

            .components-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->

    <header class="navbar">

        <div class="brand">
            <div class="logo">
                <i data-lucide="box"></i>
            </div>

            <div>
                <h2>Component<span>Hub</span></h2>
                <p>Software Component Catalogue</p>
            </div>
        </div>

        <nav class="nav-links">

            <a href="../index.html" class="nav-item">
                <i data-lucide="house"></i>
                Home
            </a>

            <a href="browse.html" class="nav-item active">
                <i data-lucide="layout-grid"></i>
                Browse
            </a>

            <a href="search.html" class="nav-item">
                <i data-lucide="search"></i>
                Search
            </a>

            <a href="add-component.html" class="nav-item">
                <i data-lucide="plus-square"></i>
                Add Component
            </a>

            <a href="statistics.html" class="nav-item">
                <i data-lucide="chart-no-axes-column"></i>
                Statistics
            </a>

        </nav>

        <div class="profile">
            <div class="avatar">S</div>
            <span>Student</span>
        </div>

    </header>


    <!-- PAGE -->

    <main class="browse-page">

        <div class="browse-header">

            <div>
                <h1>Browse Components</h1>

                <p>
                    Explore reusable software components
                    organised by category.
                </p>
            </div>

            <div>
                <span
                    class="component-count-total"
                    id="totalCount"
                >
                    12 components
                </span>
            </div>

        </div>


        <!-- FILTERS -->

        <section class="filters">

            <div class="filter-search">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search components..."
                >
            </div>

            <select id="categoryFilter" class="filter-select">

                <option value="all">
                    All Categories
                </option>

                <option value="Frontend">
                    Frontend
                </option>

                <option value="Authentication">
                    Authentication
                </option>

                <option value="Database">
                    Database
                </option>

                <option value="File Handling">
                    File Handling
                </option>

                <option value="API">
                    API
                </option>

                <option value="Utilities">
                    Utilities
                </option>

            </select>


            <select id="typeFilter" class="filter-select">

                <option value="all">
                    All Types
                </option>

                <option value="Code">
                    Code
                </option>

                <option value="Design">
                    Design
                </option>

            </select>


            <select id="languageFilter" class="filter-select">

                <option value="all">
                    All Languages
                </option>

                <option value="Python">
                    Python
                </option>

                <option value="JavaScript">
                    JavaScript
                </option>

                <option value="C++">
                    C++
                </option>

                <option value="SQL">
                    SQL
                </option>

            </select>


            <select id="sortFilter" class="filter-select">

                <option value="name">
                    Sort: Name
                </option>

                <option value="usage">
                    Sort: Most Used
                </option>

                <option value="newest">
                    Sort: Newest
                </option>

            </select>

        </section>


        <!-- COMPONENTS -->

        <section
            class="components-grid"
            id="componentsGrid"
        ></section>


        <div
            class="no-results"
            id="noResults"
        >
            <h3>No components found</h3>

            <p>
                Try changing your search or filters.
            </p>
        </div>

    </main>


    <script src="https://unpkg.com/lucide@latest"></script>

    <script src="../js/browse.js"></script>

</body>
</html>
