<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Search | ComponentHub</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>

        .search-page {
            background: #f8f9fd;
            min-height: calc(100vh - 76px);
            padding: 50px 7%;
        }

        .search-header {
            max-width: 800px;
            margin: 0 auto 35px;
            text-align: center;
        }

        .search-header h1 {
            font-size: 34px;
            margin-bottom: 10px;
        }

        .search-header p {
            color: var(--muted);
            font-size: 14px;
        }

        .search-box-large {
            max-width: 800px;
            margin: 0 auto 25px;
            display: flex;
            gap: 10px;
        }

        .search-box-large input {
            flex: 1;
            height: 50px;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0 16px;
            font-size: 14px;
            outline: none;
        }

        .search-box-large input:focus {
            border-color: var(--primary);
        }

        .search-button {
            height: 50px;
            padding: 0 25px;
            border: none;
            border-radius: 10px;
            background: var(--primary);
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .popular-searches {
            max-width: 800px;
            margin: 0 auto 35px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .popular-searches strong {
            font-size: 12px;
        }

        .search-tag {
            border: none;
            background: #eef1fb;
            color: #53617d;
            padding: 7px 11px;
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1100px;
            margin: 0 auto 20px;
        }

        .results-header h2 {
            font-size: 20px;
        }

        .result-count {
            color: var(--muted);
            font-size: 13px;
        }

        .results-grid {
            max-width: 1100px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .result-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            transition: 0.2s;
        }

        .result-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(35, 55, 100, 0.08);
        }

        .result-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .result-icon {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: #eef0ff;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .result-type {
            background: #edf8f4;
            color: #15936a;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 10px;
        }

        .result-card h3 {
            font-size: 16px;
            margin-bottom: 7px;
        }

        .result-description {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .result-meta {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .result-tag {
            background: #f0f3fa;
            color: #52617d;
            padding: 5px 8px;
            border-radius: 6px;
            font-size: 10px;
        }

        .result-footer {
            border-top: 1px solid #edf0f5;
            padding-top: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-usage {
            color: var(--muted);
            font-size: 11px;
        }

        .details-link {
            border: none;
            background: none;
            color: var(--primary);
            font-weight: 600;
            font-size: 11px;
            cursor: pointer;
        }

        .empty-results {
            max-width: 800px;
            margin: 30px auto;
            background: white;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 60px 20px;
            text-align: center;
            display: none;
        }

        .empty-results p {
            color: var(--muted);
            margin-top: 8px;
            font-size: 13px;
        }

        @media (max-width: 900px) {

            .results-grid {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 600px) {

            .search-page {
                padding: 35px 5%;
            }

            .search-box-large {
                flex-direction: column;
            }

            .results-grid {
                grid-template-columns: 1fr;
            }

            .results-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 5px;
            }

        }

    </style>

</head>


<body>

    <!-- NAVBAR -->

    <header class="navbar">

        <div class="brand">

            <div class="logo">
                <i data-lucide="box"></i>
            </div>

            <div>

                <h2>
                    Component<span>Hub</span>
                </h2>

                <p>
                    Software Component Catalogue
                </p>

            </div>

        </div>


        <nav class="nav-links">

            <a href="../index.html" class="nav-item">
                <i data-lucide="house"></i>
                Home
            </a>

            <a href="browse.html" class="nav-item">
                <i data-lucide="layout-grid"></i>
                Browse
            </a>

            <a href="search.html" class="nav-item active">
                <i data-lucide="search"></i>
                Search
            </a>

            <a href="add-component.html" class="nav-item">
                <i data-lucide="plus-square"></i>
                Add Component
            </a>

            <a href="statistics.html" class="nav-item">
                <i data-lucide="chart-no-axes-column"></i>
                Statistics
            </a>

        </nav>


        <div class="profile">

            <div class="avatar">
                S
            </div>

            <span>
                Student
            </span>

        </div>

    </header>


    <!-- SEARCH PAGE -->

    <main class="search-page">

        <section class="search-header">

            <h1>
                Search Components
            </h1>

            <p>
                Find reusable software components using
                names, descriptions and keywords.
            </p>

        </section>


        <div class="search-box-large">

            <input
                type="text"
                id="searchInput"
                placeholder="Search for components, keywords or technologies..."
            >

            <button
                class="search-button"
                id="searchButton"
            >
                Search
            </button>

        </div>


        <div class="popular-searches">

            <strong>
                Popular:
            </strong>

            <button class="search-tag">
                authentication
            </button>

            <button class="search-tag">
                database
            </button>

            <button class="search-tag">
                API
            </button>

            <button class="search-tag">
                UI
            </button>

            <button class="search-tag">
                Python
            </button>

        </div>


        <div class="results-header">

            <h2 id="resultsTitle">
                All Components
            </h2>

            <span
                class="result-count"
                id="resultCount"
            >
                12 components
            </span>

        </div>


        <section
            class="results-grid"
            id="resultsGrid"
        ></section>


        <div
            class="empty-results"
            id="emptyResults"
        >

            <h3>
                No components found
            </h3>

            <p>
                Try a different keyword or search term.
            </p>

        </div>

    </main>


    <script src="https://unpkg.com/lucide@latest"></script>

    <script src="../js/search.js"></script>

</body>

</html>
