<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Component Details | ComponentHub</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>

        .details-page {
            background: #f8f9fd;
            min-height: calc(100vh - 76px);
            padding: 50px 7%;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--primary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 25px;
        }

        .details-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 35px;
            max-width: 1000px;
            margin: auto;
        }

        .details-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 30px;
        }

        .details-title {
            display: flex;
            gap: 18px;
            align-items: center;
        }

        .details-icon {
            width: 65px;
            height: 65px;
            border-radius: 15px;
            background: #eef0ff;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 27px;
            font-weight: 700;
        }

        .details-title h1 {
            font-size: 30px;
            margin-bottom: 6px;
        }

        .details-title p {
            color: var(--muted);
            font-size: 13px;
        }

        .type-badge {
            background: #edf8f4;
            color: #15936a;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 12px;
            white-space: nowrap;
        }

        .details-section {
            border-top: 1px solid #edf0f5;
            padding-top: 25px;
            margin-top: 25px;
        }

        .details-section h2 {
            font-size: 17px;
            margin-bottom: 12px;
        }

        .description {
            color: var(--muted);
            line-height: 1.7;
            font-size: 14px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .info-box {
            background: #f8f9fd;
            border-radius: 10px;
            padding: 16px;
        }

        .info-box span {
            display: block;
            color: var(--muted);
            font-size: 11px;
            margin-bottom: 6px;
        }

        .info-box strong {
            font-size: 14px;
        }

        .tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tag {
            background: #eef1f8;
            color: #52617d;
            padding: 7px 11px;
            border-radius: 7px;
            font-size: 12px;
        }

        .usage-box {
            display: flex;
            align-items: center;
            gap: 18px;
            background: #f5f6ff;
            padding: 20px;
            border-radius: 12px;
        }

        .usage-number {
            font-size: 30px;
            font-weight: 700;
            color: var(--primary);
        }

        .usage-text {
            color: var(--muted);
            font-size: 13px;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .btn {
            padding: 11px 18px;
            border-radius: 9px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-secondary {
            background: white;
            color: var(--text);
            border: 1px solid var(--border);
        }

        .not-found {
            text-align: center;
            padding: 80px 20px;
        }

        @media (max-width: 700px) {

            .details-page {
                padding: 30px 5%;
            }

            .details-header {
                flex-direction: column;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

    <!-- NAVBAR -->

    <header class="navbar">

        <div class="brand">

            <div class="logo">
                <i data-lucide="box"></i>
            </div>

            <div>
                <h2>Component<span>Hub</span></h2>
                <p>Software Component Catalogue</p>
            </div>

        </div>


        <nav class="nav-links">

            <a href="../index.html" class="nav-item">
                <i data-lucide="house"></i>
                Home
            </a>

            <a href="browse.html" class="nav-item active">
                <i data-lucide="layout-grid"></i>
                Browse
            </a>

            <a href="search.html" class="nav-item">
                <i data-lucide="search"></i>
                Search
            </a>

            <a href="add-component.html" class="nav-item">
                <i data-lucide="plus-square"></i>
                Add Component
            </a>

            <a href="statistics.html" class="nav-item">
                <i data-lucide="chart-no-axes-column"></i>
                Statistics
            </a>

        </nav>


        <div class="profile">

            <div class="avatar">S</div>

            <span>Student</span>

        </div>

    </header>


    <!-- COMPONENT DETAILS -->

    <main class="details-page">

        <a href="browse.html" class="back-link">
            ← Back to Browse
        </a>


        <div id="componentContainer">

            <!-- JavaScript will insert component details here -->

        </div>

    </main>


    <script src="https://unpkg.com/lucide@latest"></script>

    <script src="../js/component.js"></script>

</body>

</html>
